<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>삼척 바다풍경 펜션 - 객실안내</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css" />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="삼척 바다풍경 펜션 - 객실안내" />
  <meta property="og:description" content="강원도 삼척의 바다풍경은 푸른 바닷가와 장호항 인근 위치하며 개별바베큐와 다양한 부대시설이 있습니다. 커플,가족과 함께 즐거운 시간 보내세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/05/OzUPyRZuqkK7.jpg" />
  <meta property="og:url" content="https://yh-seascape.co.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="삼척 바다풍경 펜션 - 객실안내" />
  <meta name="twitter:description" content="강원도 삼척의 바다풍경은 푸른 바닷가와 장호항 인근 위치하며 개별바베큐와 다양한 부대시설이 있습니다. 커플,가족과 함께 즐거운 시간 보내세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/05/OzUPyRZuqkK7.jpg" />
  <meta name="naver-site-verification" content="3ae46b9710bc928120c6d5430ba495fc40bb2025" />
  <meta name="google-site-verification" content="hLgP5dDdA_jUv01Na1B9aXRZb0theMCSDOXtk_FMddA" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 서브 히어로 -->
        <div class="sub_visual_wide visual">
          <div class="visual_box">
            <div class="visual_txt">
              <span data-property-name-en-caps></span>
              <strong data-room-name></strong>
              <p data-room-hero-description></p>
              <div class="sub_cate_wrap">
                <ul data-room-list-nav>
                  <li><a href="./layout-map.html">미리보기</a></li>
                </ul>
              </div>
            </div>
            <div class="swiper-container">
              <div class="swiper-wrapper" data-room-hero-slides></div>
            </div>
          </div>
        </div>

        <section id="content" class="sub_cont sub2_2 sub_room sub_room_detail">
          <div class="sub_cont">
            <div class="title_box">
              <p>Room's Preview</p>
              <h3 class="ff_noto_serif" data-room-name></h3>
            </div>

            <!-- 객실 이미지 슬라이더 -->
            <div class="sub_img_sld inner">
              <div class="sld_box">
                <div class="swiper-container">
                  <div class="swiper-wrapper" data-room-gallery-slides></div>
                </div>
                <div class="sld_txt">
                  <span>This place provides the best time for those who are staying</span>
                  <p data-room-gallery-description></p>
                  <a href="#!" target="_blank" class="btn_reserve" data-booking-link>예약하기</a>
                </div>
                <div class="swiper-button-next"><img src="images/common/arrow_right.png" alt="next" /></div>
                <div class="swiper-button-prev"><img src="images/common/arrow_left.png" alt="prev" /></div>
              </div>
              <div class="img_box" data-room-img-box>
                <img src="data:," alt="" class="img01" />
                <img src="data:," alt="" class="img02" />
              </div>
            </div>

            <!-- 장식 카피 (하드코딩) -->
            <div class="main_txt main_txt_l">
              <strong>Room Preview</strong>
              <p class="txt_transform" data-property-name-en></p>
            </div>

            <!-- 객실 정보 테이블 -->
            <div class="table_box inner">
              <div class="title_box2">
                <h4>Room Price</h4>
                <p>Reservation Information</p>
              </div>
              <div class="price_table">
                <table cellspacing="0" cellpadding="0" class="table_default">
                  <thead>
                    <tr>
                      <th style="width: 30%">객실명</th>
                      <th style="width: 10%">기준</th>
                      <th style="width: 10%">최대</th>
                      <th style="width: 30%">유형</th>
                      <th style="width: 20%">평형</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td scope="row" data-room-name></td>
                      <td data-room-base-occupancy></td>
                      <td data-room-max-occupancy></td>
                      <td data-room-structure></td>
                      <td data-room-size-pyeong></td>
                    </tr>
                  </tbody>
                </table>
                <ul class="table_text" data-room-amenities-wrap>
                  <li><strong>집기품목</strong> : <span data-room-amenities></span></li>
                </ul>
              </div>
              <div class="btn_wrap">
                <a href="#!" target="_blank" class="btn_reserve" data-booking-link>예약하기</a>
              </div>
            </div>

            <!-- 숙소명 + 객실명 + 예약 버튼 (원본 구조: strong 다음 바로 btn_reserve) -->
            <div class="sub_txt_box inner">
              <div class="txt">
                <strong><span data-property-name-en></span> <span class="ff_noto_serif" data-room-name></span></strong>
                <a href="#!" target="_blank" class="btn_reserve" data-booking-link>예약하기</a>
              </div>
            </div>

            <!-- 하단 와이드 객실 사진 (원본 .wide_img 1장). 이미지가 없으면 영역째 숨긴다. -->
            <div class="wide_img inner" data-room-wide-section>
              <!-- data-* 속성 : data-room-wide-image | roomtypes[current] roomtype_exterior[0] -->
              <img src="data:," alt="객실 이미지" data-room-wide-image />
            </div>

            <!-- 객실 평면도 (평면도 이미지가 있을 때만 노출) -->
            <div data-room-floorplan-section>
              <div class="title_box">
                <h3>객실 평면도</h3>
              </div>
              <div class="wide_img inner">
                <img src="data:," alt="객실평면도" data-room-floorplan-image />
              </div>
            </div>

            <!-- 하단 Room Preview -->
            <div class="main_room">
              <div class="inner">
                <div class="title_box">
                  <p data-room-preview-eyebrow></p>
                  <h3>Room's Preview</h3>
                </div>
                <div class="room_list">
                  <div class="img_mouse"><img src="data:," alt="" /></div>
                  <div class="swiper-container">
                    <div class="swiper-wrapper" data-room-list-slides></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <div id="popup-container"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/room-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/room.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
